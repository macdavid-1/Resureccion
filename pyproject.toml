[project]
name = "resurreccion"
version = "0.1.0"
description = "Private single-user autonomous KDP market-research agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
    "httpx>=0.27",
    "pillow>=10.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4.9",
    "playwright>=1.42",
    "camoufox[geoip]>=0.5.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
