# resureccion.omnivex-academy.xyz → the Resurrección container.
#
# Root domain (omnivex-academy.xyz) keeps pointing at your other app — this
# file only claims the resureccion subdomain. Install it on the VPS host's
# reverse proxy (nginx), e.g.:
#   - DNS: an A record  resureccion.omnivex-academy.xyz  →  <vps-ip>
#   - certificate: certbot --nginx -d resureccion.omnivex-academy.xyz
#     (or a wildcard *.omnivex-academy.xyz cert if you already have one)
#   - then: nginx -t && systemctl reload nginx
#
# The container itself binds 127.0.0.1:7860 (see docker-compose.yml), so the
# only public edge is this proxy. Set COOKIE_SECURE=true in the container's
# .env so the session cookie is HTTPS-only.

# --- http → https redirect --------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name resureccion.omnivex-academy.xyz;
    return 301 https://$host$request_uri;
}

# --- the app ---------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name resureccion.omnivex-academy.xyz;

    ssl_certificate     /etc/letsencrypt/live/omnivex-academy.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omnivex-academy.xyz/privkey.pem;

    # Uploads: KDSpy .zip install, reference images, export bundles.
    client_max_body_size 64m;

    # Research streaming (live view frames, SSE trace, long model calls) —
    # buffering off and a generous read timeout keep live streams instant.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
